<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Recipe Hub</title>
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- FontAwesome Icons for UI UI elements -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <div class="container header-container">
            <h1><i class="fa-solid => dynamic food icon"></i> Recipe & Weather Hub</h1>
            
            <!-- Weather Widget in Header -->
            <div id="weather-widget" class="weather-widget">
                <div class="weather-info">
                    <span id="city-name">Loading location...</span>
                    <span id="temp">--°C</span>
                </div>
                <div id="weather-icon"><i class="fa-solid fa-cloud-sun"></i></div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        
        <!-- Search & Filter Controls -->
        <section class="search-section">
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search for recipes or ingredients..." required>
                <button type="submit" id="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </form>
            <button id="location-btn" class="btn-secondary">
                <i class="fa-solid fa-location-crosshairs"></i> Detect My Weather
            </button>
        </section>

        <!-- Weather Suggestion Banner -->
        <section id="weather-suggestion" class="weather-banner">
            <h3><i class="fa-solid fa-utensils"></i> Suggested Meals for Today</h3>
            <p id="suggestion-text">Fetching current weather to suggest perfect recipes...</p>
        </section>

        <!-- Recipe Results Section -->
        <section class="recipes-section">
            <h2>Featured Recipes</h2>
            <div id="recipe-grid" class="recipe-grid">
                <!-- Dynamic Recipe Cards will be inserted here via JS -->
            </div>
        </section>

    </main>

    <!-- Recipe Detail Modal / Popup -->
    <div id="recipe-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <div id="modal-body">
                <!-- Detailed recipe info will render dynamically -->
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/storage.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/recipe.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
